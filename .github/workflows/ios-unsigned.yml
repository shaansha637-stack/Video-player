name: Build DragoPlayer Unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -e
          xcodegen generate

          echo "Generated project:"
          ls -la

          test -f DragoPlayer.xcodeproj/project.pbxproj

      - name: Clean build
        run: |
          set -e

          xcodebuild \
            -project DragoPlayer.xcodeproj \
            -scheme DragoPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean

      - name: Build unsigned application
        run: |
          set -e

          mkdir -p build/DerivedData

          xcodebuild \
            -project DragoPlayer.xcodeproj \
            -scheme DragoPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Find application
        run: |
          set -e

          echo "Searching for DragoPlayer.app..."

          find build/DerivedData \
            -type d \
            -name "DragoPlayer.app" \
            -print

          APP_PATH=$(find \
            build/DerivedData \
            -type d \
            -name "DragoPlayer.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: DragoPlayer.app was not created."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Inspect application
        run: |
          set -e

          echo "Application:"
          echo "$APP_PATH"

          echo ""
          echo "Application contents:"
          find "$APP_PATH" -maxdepth 2 -type f | head -100

          echo ""
          echo "Info.plist:"
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$APP_PATH/Info.plist"

      - name: Create unsigned IPA
        run: |
          set -e

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/DragoPlayer.app

          cd build

          rm -f DragoPlayer-unsigned.ipa

          /usr/bin/zip \
            -qry \
            DragoPlayer-unsigned.ipa \
            Payload

          cd ..

          echo ""
          echo "IPA created:"
          ls -lh build/DragoPlayer-unsigned.ipa

          test -f build/DragoPlayer-unsigned.ipa

      - name: Verify IPA
        run: |
          set -e

          echo "IPA contents:"
          unzip -l build/DragoPlayer-unsigned.ipa

          echo ""
          echo "Checking Payload..."

          unzip -Z1 build/DragoPlayer-unsigned.ipa | \
            grep "Payload/DragoPlayer.app/Info.plist"

          echo ""
          echo "Unsigned IPA verification successful."

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: DragoPlayer-unsigned-IPA
          path: build/DragoPlayer-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
