name: Build DragoPlayer Unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -e
          xcodegen generate

          echo "===== PROJECT ====="
          ls -la
          test -f DragoPlayer.xcodeproj/project.pbxproj

      - name: Show project settings
        run: |
          xcodebuild \
            -project DragoPlayer.xcodeproj \
            -scheme DragoPlayer \
            -showBuildSettings \
            > build-settings.txt 2>&1

          grep -E \
            "PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|CODE_SIGN|SWIFT_VERSION|SDKROOT" \
            build-settings.txt || true

      - name: Build unsigned application
        shell: bash
        run: |
          set +e

          rm -rf build
          mkdir -p build

          echo "===== START XCODE BUILD ====="

          xcodebuild \
            -project DragoPlayer.xcodeproj \
            -scheme DragoPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            clean build \
            2>&1 | tee build/xcodebuild.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "===== XCODE ERROR SUMMARY ====="

          grep -nE \
            "error:|fatal error:|BUILD FAILED|SwiftCompile failed|CompileSwift failed" \
            build/xcodebuild.log \
            | tail -100 || true

          echo ""
          echo "===== LAST 150 LINES ====="

          tail -150 build/xcodebuild.log

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo ""
            echo "XCODE BUILD FAILED: $BUILD_STATUS"
            exit "$BUILD_STATUS"
          fi

      - name: Find application
        if: success()
        run: |
          set -e

          APP_PATH=$(find \
            build/DerivedData/Build/Products \
            -type d \
            -name "DragoPlayer.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: DragoPlayer.app not found"
            find build/DerivedData -type d -name "*.app" -print
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "Found:"
          echo "$APP_PATH"

      - name: Create unsigned IPA
        if: success()
        run: |
          set -e

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/DragoPlayer.app

          cd build

          zip -qry \
            DragoPlayer-unsigned.ipa \
            Payload

          cd ..

          ls -lh build/DragoPlayer-unsigned.ipa

      - name: Verify IPA
        if: success()
        run: |
          set -e

          test -f build/DragoPlayer-unsigned.ipa

          unzip -l \
            build/DragoPlayer-unsigned.ipa

          echo "IPA verification successful."

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DragoPlayer-unsigned-IPA
          path: build/DragoPlayer-unsigned.ipa
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DragoPlayer-Xcode-Build-Log
          path: |
            build/xcodebuild.log
            build-settings.txt
          if-no-files-found: ignore
          retention-days: 7
